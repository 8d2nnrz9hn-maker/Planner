<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مواعيدي وتسليماتي</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مواعيدي"><meta name="theme-color" content="#6B2FA0"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap"><style id="css">
/* Layout idea: one phone-width column; the day's ranked list is the page, with big kufic rank numerals as the only loud element. */
:root{
  --bg:#F4F1F6; --surface:#FFFFFF; --ink:#241A2B; --muted:#6F6478; --line:#E1DAE6;
  --accent:#6B2FA0; --accent-ink:#FFFFFF; --soft:#EDE4F4;
  --exam:#B3261E; --due:#9A5B00; --appt:#0B7A75; --task:#55606E;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17121B; --surface:#221B28; --ink:#EFE8F3; --muted:#A698B0; --line:#372C40;
    --accent:#C59BEA; --accent-ink:#1B1220; --soft:#2E2338;
    --exam:#FF8A80; --due:#F2B84B; --appt:#5FD0C8; --task:#A9B4C2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17121B; --surface:#221B28; --ink:#EFE8F3; --muted:#A698B0; --line:#372C40;
  --accent:#C59BEA; --accent-ink:#1B1220; --soft:#2E2338;
  --exam:#FF8A80; --due:#F2B84B; --appt:#5FD0C8; --task:#A9B4C2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:18px}

.hd{display:flex;flex-direction:column;gap:10px}
.hd .day{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.25;margin:0;text-wrap:balance}
.hd .sub{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.next{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next b{font-weight:600}
.next .cd{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);white-space:nowrap}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.alert small{display:block;opacity:.85}
.alert button{background:transparent;border:1.5px solid currentColor;border-radius:99px;padding:6px 14px;color:inherit;flex:none}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}

h2{font-family:var(--display);font-weight:500;font-size:20px;margin:6px 0 0}
.hint{color:var(--muted);font-size:14px;margin:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--tc);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:64px}
.row.t-exam{--tc:var(--exam)} .row.t-due{--tc:var(--due)} .row.t-appt{--tc:var(--appt)} .row.t-task{--tc:var(--task)}
.rank{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--accent);width:30px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.ck{flex:none;display:grid;place-items:center;width:40px;height:40px}
.ck input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:8px;margin:0;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:13px;height:7px;border:solid var(--accent-ink);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.body{flex:1;min-width:0;background:none;border:0;padding:2px 0;text-align:start;display:flex;flex-direction:column;gap:3px}
.ttl{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.chip{color:var(--tc);border:1.5px solid var(--tc);border-radius:99px;padding:0 9px;font-size:12.5px;font-weight:600}
.late{color:var(--exam);font-weight:600}
.hi{font-weight:600;color:var(--ink)}
.row.done .ttl{text-decoration:line-through;color:var(--muted);font-weight:500}
.row.done .rank{color:var(--line)}
.row.done{border-inline-start-color:var(--line)}

.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tl li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.tl li:first-child{border-top:0}
.tl time{font-variant-numeric:tabular-nums;font-weight:600;min-width:74px;color:var(--accent)}
.tl li.past{opacity:.5}
.tl li.past time{color:var(--muted)}

.grp{display:flex;flex-direction:column;gap:8px}
.grp h3{font-size:14px;font-weight:600;color:var(--muted);margin:8px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:8px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.note{background:var(--surface);border:1px dashed var(--muted);border-radius:14px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note button,.ghost{background:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px}
.status{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

.fab{position:fixed;inset-block-end:18px;inset-inline:0;margin:0 auto;width:max-content;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 28px;font-weight:600;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0}
.f{display:flex;flex-direction:column;gap:6px}
.f>span,.f legend{font-size:14px;font-weight:600;color:var(--muted);padding:0}
fieldset.f{border:0;margin:0;padding:0}
.f input[type=text],.f input[type=date],.f input[type=time],.f select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:48px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;background:var(--bg)}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.f textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-family:ui-monospace,monospace;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--exam);font-size:14px;margin:0;min-height:1em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .save{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px;font-weight:600}
.acts .ghost{border-radius:12px;padding:13px 16px}
.acts .del{color:var(--exam);border-color:var(--exam)}
@media (max-width:380px){.hd .day{font-size:28px}.rank{font-size:24px;width:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><script type="application/json" id="state">{"v":1,"updatedAt":1,"items":[]}</script><script id="js">
(function(){
'use strict';
var KEY='planner-state-v1', DKEY='planner-dismissed-v1', TITLE='مواعيدي وتسليماتي';
var FONTS='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">';
var TYPES={exam:'اختبار',due:'تسليم',appt:'موعد',task:'مهمة'};
var TW={exam:25,due:20,appt:15,task:5};
var PR={3:'عالية',2:'متوسطة',1:'عادية'};
var RM={'':'بدون تذكير','0':'وقت الموعد','15':'قبل بربع ساعة','60':'قبل بساعة','180':'قبل بـ 3 ساعات','1440':'قبل بيوم'};
var LOC='ar-KW-u-nu-latn';

var state=JSON.parse(document.getElementById('state').textContent);
try{var ls=JSON.parse(localStorage.getItem(KEY)||'null');if(ls&&ls.items&&ls.updatedAt>state.updatedAt)state=ls;}catch(e){}
var dismissed={};try{dismissed=JSON.parse(localStorage.getItem(DKEY)||'{}')||{};}catch(e){}
var tab='today',filter='all',editing=null,store=null,storeChecked=false,pubTimer=null,delArmed=false;
try{tab=sessionStorage.getItem('planner-tab')||'today';}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return(n<10?'0':'')+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parts(s){var p=s.split('-');return[+p[0],+p[1]-1,+p[2]];}
function daysTo(s,now){var p=parts(s);return Math.round((Date.UTC(p[0],p[1],p[2])-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);}
function at(it){var p=parts(it.date),t=(it.time||'08:00').split(':');return new Date(p[0],p[1],p[2],+t[0],+t[1]);}
function remAt(it){if(it.remind===''||it.remind==null)return null;return new Date(at(it).getTime()-Number(it.remind)*6e4);}
function fTime(d){return d.toLocaleTimeString(LOC,{hour:'numeric',minute:'2-digit'});}
function fDate(s){var p=parts(s);return new Date(p[0],p[1],p[2]).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});}
function nDays(n){n=Math.abs(n);if(n===1)return'يوم';if(n===2)return'يومين';if(n<=10)return n+' أيام';return n+' يوم';}
function when(n){if(n===0)return'اليوم';if(n===1)return'باجر';return'بعد '+nDays(n);}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}

/* Today's ranked list: overdue, due today, and preparation for exams (7 days) and deadlines (3 days). */
function todayRows(now){
  var t=dstr(now),rows=[];
  state.items.forEach(function(it){
    var n=daysTo(it.date,now),base=(it.pr||1)*15-15+TW[it.type];
    if(n<0){if(!it.done)rows.push({it:it,kind:'main',done:false,score:base+60-n,why:'<span class="late">متأخر '+nDays(n)+'</span>'});}
    else if(n===0){
      var m=it.time?at(it).getHours()*60+at(it).getMinutes():1440;
      rows.push({it:it,kind:'main',done:!!it.done,score:base+50+10*(1-m/1440),why:it.time?'اليوم '+fTime(at(it)):'اليوم'});
    }else if(!it.done&&((it.type==='exam'&&n<=7)||(it.type==='due'&&n<=3))){
      var w=it.worked&&it.worked[t];
      rows.push({it:it,kind:'prep',done:!!w,score:base+40-n*(it.type==='exam'?5:8),why:(it.type==='exam'?'الاختبار ':'التسليم ')+when(n)});
    }
  });
  rows.sort(function(a,b){return(a.done-b.done)||(b.score-a.score);});
  return rows;
}
function rowHTML(r,rank){
  var it=r.it,prep=r.kind==='prep';
  var ttl=prep?(it.type==='exam'?'ذاكري لـ ':'اشتغلي على ')+it.title:it.title;
  return '<li class="row t-'+it.type+(r.done?' done':'')+'">'+
    (rank?'<span class="rank" aria-hidden="true">'+rank+'</span>':'')+
    '<label class="ck"><input type="checkbox" data-act="'+(prep?'worked':'toggle')+'" data-id="'+esc(it.id)+'"'+(r.done?' checked':'')+' aria-label="'+esc((prep?'اشتغلت اليوم على ':'خلصت ')+it.title)+'"></label>'+
    '<button class="body" data-act="edit" data-id="'+esc(it.id)+'"><span class="ttl">'+esc(ttl)+'</span>'+
    '<span class="meta"><span class="chip">'+TYPES[it.type]+'</span><span>'+r.why+'</span>'+
    (it.pr===3?'<span class="hi">أولوية عالية</span>':'')+(it.note?'<span>'+esc(it.note)+'</span>':'')+'</span></button></li>';
}
function activeAlerts(now){
  return state.items.filter(function(it){
    var ra=remAt(it);if(!ra||it.done)return false;
    var end=it.time?new Date(at(it).getTime()+2*36e5):new Date(parts(it.date)[0],parts(it.date)[1],parts(it.date)[2],23,59);
    return now>=ra&&now<=end&&!dismissed[akey(it)];
  });
}
function akey(it){return it.id+'@'+it.date+'T'+it.time+'/'+it.remind;}
function timeline(now){
  var t=dstr(now),out=[];
  state.items.forEach(function(it){
    if(it.done)return;
    if(it.date===t&&it.time)out.push({d:at(it),tx:TYPES[it.type]+': '+it.title});
    var ra=remAt(it);
    if(ra&&Number(it.remind)>0&&dstr(ra)===t)out.push({d:ra,tx:'تذكير: '+it.title+' ('+RM[String(it.remind)]+')'});
    if(ra&&!it.time&&it.date===t)out.push({d:ra,tx:'تذكير: '+it.title});
  });
  out.sort(function(a,b){return a.d-b.d;});
  return out;
}

function render(){
  var now=new Date(),t=dstr(now),rows=todayRows(now);
  var total=rows.length,done=rows.filter(function(r){return r.done;}).length;
  var ex=state.items.filter(function(i){return i.type==='exam'&&!i.done&&daysTo(i.date,now)>=0;}).sort(function(a,b){return at(a)-at(b);})[0];
  var h='<h1 class="day">'+esc(fDate(t))+'</h1>'+
    '<div class="sub"><span>'+(total?'خلصتي '+done+' من '+total+' اليوم':'ما عندج شي مسجل لليوم')+'</span></div>'+
    '<div class="bar" role="img" aria-label="إنجاز اليوم"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>';
  if(ex)h+='<div class="next"><span>أقرب اختبار<br><b>'+esc(ex.title)+'</b></span><span class="cd">'+when(daysTo(ex.date,now))+'</span></div>';
  document.getElementById('hd').innerHTML=h;

  document.getElementById('alerts').innerHTML=activeAlerts(now).map(function(it){
    return '<div class="alert" role="alert"><span><b>'+esc(it.title)+'</b><small>'+TYPES[it.type]+' · '+esc(fDate(it.date))+(it.time?' · '+fTime(at(it)):'')+'</small></span><button data-act="dismiss" data-id="'+esc(it.id)+'">تمام</button></div>';
  }).join('');

  var tb=document.querySelectorAll('.tabs button');
  for(var i=0;i<tb.length;i++)tb[i].setAttribute('aria-selected',tb[i].dataset.tab===tab?'true':'false');

  var v='';
  if(state.items.some(function(i){return i.ex;}))v+='<div class="note"><span>هذي أمثلة عشان تشوفين الشكل.</span><button data-act="clearex">امسحي الأمثلة</button></div>';
  if(tab==='today'){
    v+='<h2>أولويات اليوم</h2><p class="hint">مرتبة حسب الوقت، قرب الموعد، والأولوية. الأهم فوق.</p>';
    if(!rows.length)v+='<div class="empty">ما عندج شي اليوم. ضيفي اختبار أو موعد أو تسليم من زر الإضافة.</div>';
    else{var k=0;v+='<ol class="list">'+rows.map(function(r){return rowHTML(r,r.done?'✓':String(++k));}).join('')+'</ol>';}
    var tl=timeline(now);
    v+='<h2>تذكيرات اليوم</h2>';
    v+=tl.length?'<ul class="tl">'+tl.map(function(e){return '<li class="'+(e.d<now?'past':'')+'"><time>'+fTime(e.d)+'</time><span>'+esc(e.tx)+'</span></li>';}).join('')+'</ul>'
      :'<div class="empty">ما في تذكيرات بوقت محدد اليوم.</div>';
    v+='<p class="hint">التذكير يطلع فوق الصفحة والتطبيق مفتوح.</p>';
  }else{
    v+='<div class="filters">'+[['all','الكل'],['exam','اختبارات'],['due','تسليمات'],['appt','مواعيد'],['task','مهام']].map(function(f){
      return '<button data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>';
    var list=state.items.filter(function(i){return filter==='all'||i.type===filter;});
    var open=list.filter(function(i){return !i.done;}).sort(function(a,b){return at(a)-at(b)||((a.time||'99')<(b.time||'99')?-1:1);});
    var fin=list.filter(function(i){return i.done;}).sort(function(a,b){return at(b)-at(a);});
    if(!open.length)v+='<div class="empty">ما في شي قادم هني.</div>';
    var cur=null;
    open.forEach(function(it){
      var n=daysTo(it.date,now),g=n<0?'متأخر':it.date;
      if(g!==cur){if(cur!==null)v+='</ul></div>';cur=g;v+='<div class="grp"><h3>'+(n<0?'متأخر':esc(fDate(it.date))+' · '+when(n))+'</h3><ul class="list">';}
      v+=rowHTML({it:it,kind:'main',done:false,why:n<0?'<span class="late">'+esc(fDate(it.date))+'</span>':(it.time?fTime(at(it)):'بدون وقت')},'');
    });
    if(cur!==null)v+='</ul></div>';
    if(fin.length)v+='<details><summary>اللي خلصتيه ('+fin.length+')</summary><ul class="list">'+fin.map(function(it){return rowHTML({it:it,kind:'main',done:true,why:esc(fDate(it.date))},'');}).join('')+'</ul></details>';
  }
  v+='<button class="ghost" data-act="import" style="align-self:center">استيراد مواعيد</button>';
  v+='<p class="status">'+(storeChecked&&!store?'محفوظ على هذا الجهاز فقط.':'التغييرات تنحفظ تلقائياً.')+'</p>';
  document.getElementById('view').innerHTML=v;
}

function buildDoc(){
  var css=document.getElementById('css').textContent,js=document.getElementById('js').textContent;
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+TITLE+'</title>'+FONTS+'<style id="css">'+css+'</style></head><body><div id="app"></div><script type="application/json" id="state">'+data+'<\/script><script id="js">'+js+'<\/script></body></html>';
}
function schedule(){
  clearTimeout(pubTimer);
  pubTimer=setTimeout(function(){
    if(document.getElementById('ov').classList.contains('open')){schedule();return;}
    if(store)store.publish(buildDoc()).catch(function(){});
  },3000);
}
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  render();schedule();
}

function openSheet(it){
  editing=it?it.id:null;delArmed=false;
  var now=new Date();
  document.getElementById('sh-title').textContent=it?'تعديل':'إضافة جديدة';
  var ty=it?it.type:'exam',pr=it?it.pr:2;
  document.querySelector('input[name=ty][value='+ty+']').checked=true;
  document.querySelector('input[name=pr][value="'+pr+'"]').checked=true;
  document.getElementById('f-title').value=it?it.title:'';
  document.getElementById('f-date').value=it?it.date:dstr(now);
  document.getElementById('f-time').value=it?it.time:'';
  document.getElementById('f-rem').value=it?String(it.remind):'60';
  document.getElementById('f-note').value=it?it.note||'':'';
  document.getElementById('f-err').textContent='';
  var d=document.getElementById('f-del');d.hidden=!it;d.textContent='حذف';
  document.getElementById('ov').classList.add('open');
  if(!it)document.getElementById('f-title').focus();
}
function closeSheet(){document.getElementById('ov').classList.remove('open');}

function shell(){
  document.getElementById('app').innerHTML=
  '<header class="hd" id="hd"></header><div class="alerts" id="alerts"></div>'+
  '<div class="tabs" role="tablist"><button role="tab" data-tab="today">اليوم</button><button role="tab" data-tab="all">كل المواعيد</button></div>'+
  '<main id="view" style="display:flex;flex-direction:column;gap:12px"></main>'+
  '<button class="fab" id="fab">+ إضافة</button>'+
  '<div class="ov" id="ov"><form class="sheet" id="form" novalidate>'+
    '<h2 id="sh-title">إضافة جديدة</h2>'+
    '<fieldset class="f"><legend>النوع</legend><div class="seg">'+Object.keys(TYPES).map(function(k){return '<label><input type="radio" name="ty" id="ty-'+k+'" value="'+k+'"><span>'+TYPES[k]+'</span></label>';}).join('')+'</div></fieldset>'+
    '<label class="f"><span>العنوان</span><input type="text" id="f-title" maxlength="120" placeholder="مثلاً: اختبار الإحصاء" autocomplete="off"></label>'+
    '<div class="two"><label class="f"><span>التاريخ</span><input type="date" id="f-date"></label><label class="f"><span>الوقت (اختياري)</span><input type="time" id="f-time"></label></div>'+
    '<fieldset class="f"><legend>الأولوية</legend><div class="seg">'+[3,2,1].map(function(k){return '<label><input type="radio" name="pr" id="pr-'+k+'" value="'+k+'"><span>'+PR[k]+'</span></label>';}).join('')+'</div></fieldset>'+
    '<label class="f"><span>التذكير</span><select id="f-rem">'+['','0','15','60','180','1440'].map(function(k){return '<option value="'+k+'">'+RM[k]+'</option>';}).join('')+'</select></label>'+
    '<label class="f"><span>ملاحظة (اختياري)</span><input type="text" id="f-note" maxlength="120" placeholder="المادة، القاعة، الفصول المطلوبة" autocomplete="off"></label>'+
    '<p class="err" id="f-err" role="alert"></p>'+
    '<div class="acts"><button type="submit" class="save">حفظ</button><button type="button" class="ghost" id="f-cancel">إلغاء</button><button type="button" class="ghost del" id="f-del" hidden>حذف</button></div>'+
  '</form></div>'+
  '<div class="ov" id="ov2"><form class="sheet" id="imp" novalidate><h2>استيراد مواعيد</h2>'+
    '<label class="f"><span>الصقي النص هني</span><textarea id="i-text" rows="7" dir="ltr"></textarea></label>'+
    '<p class="err" id="i-err" role="alert"></p>'+
    '<div class="acts"><button type="submit" class="save">إضافة</button><button type="button" class="ghost" id="i-cancel">إلغاء</button></div></form></div>';

  document.getElementById('app').addEventListener('click',function(e){
    var el=e.target.closest('[data-act],[data-tab]');if(!el)return;
    if(el.dataset.tab){tab=el.dataset.tab;try{sessionStorage.setItem('planner-tab',tab);}catch(x){}render();return;}
    var a=el.dataset.act,it=el.dataset.id?find(el.dataset.id):null;
    if(a==='edit'&&it)openSheet(it);
    else if(a==='filter'){filter=el.dataset.f;render();}
    else if(a==='dismiss'&&it){dismissed[akey(it)]=1;try{localStorage.setItem(DKEY,JSON.stringify(dismissed));}catch(x){}render();}
    else if(a==='import'){document.getElementById('i-text').value='';document.getElementById('i-err').textContent='';document.getElementById('ov2').classList.add('open');}
    else if(a==='clearex'){state.items=state.items.filter(function(i){return !i.ex;});save();}
  });
  document.getElementById('app').addEventListener('change',function(e){
    var el=e.target;if(!el.dataset||!el.dataset.act)return;
    var it=find(el.dataset.id);if(!it)return;
    if(el.dataset.act==='toggle')it.done=el.checked;
    else if(el.dataset.act==='worked'){it.worked=it.worked||{};var t=dstr(new Date());if(el.checked)it.worked[t]=1;else delete it.worked[t];}
    else return;
    save();
  });
  document.getElementById('fab').addEventListener('click',function(){openSheet(null);});
  document.getElementById('f-cancel').addEventListener('click',closeSheet);
  document.getElementById('i-cancel').addEventListener('click',function(){document.getElementById('ov2').classList.remove('open');});
  document.getElementById('imp').addEventListener('submit',function(e){
    e.preventDefault();
    var raw=document.getElementById('i-text').value,err=document.getElementById('i-err'),arr;
    try{arr=JSON.parse(raw.slice(raw.indexOf('['),raw.lastIndexOf(']')+1).replace(/[\u201c\u201d]/g,'"'));}
    catch(x){err.textContent='النص مو صحيح. انسخيه كامل من أول [ لآخر ].';return;}
    var n=0;
    arr.forEach(function(o){
      if(!o||!TYPES[o.type]||!o.title||!/^\d{4}-\d{2}-\d{2}$/.test(o.date))return;
      var time=/^\d{2}:\d{2}$/.test(o.time||'')?o.time:'';
      if(state.items.some(function(i){return i.type===o.type&&i.title===o.title&&i.date===o.date&&i.time===time;}))return;
      var r=o.remind;r=(r===''||r==null||!RM[String(r)])?'':+r;
      state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)+n,type:o.type,title:String(o.title).slice(0,120),date:o.date,time:time,pr:[1,2,3].indexOf(+o.pr)>=0?+o.pr:2,remind:r,note:String(o.note||'').slice(0,120),done:false});n++;
    });
    if(!n){err.textContent='ما انضاف شي. يمكن المواعيد موجودة من قبل.';return;}
    document.getElementById('ov2').classList.remove('open');save();
  });
  document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSheet();});
  document.getElementById('f-del').addEventListener('click',function(){
    if(!delArmed){delArmed=true;this.textContent='أكيد؟ اضغطي مرة ثانية';return;}
    state.items=state.items.filter(function(i){return i.id!==editing;});closeSheet();save();
  });
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var title=document.getElementById('f-title').value.trim(),date=document.getElementById('f-date').value;
    if(!title){document.getElementById('f-err').textContent='اكتبي عنوان.';return;}
    if(!date){document.getElementById('f-err').textContent='اختاري التاريخ.';return;}
    var rem=document.getElementById('f-rem').value;
    var v={type:document.querySelector('input[name=ty]:checked').value,title:title,date:date,time:document.getElementById('f-time').value,
      pr:+document.querySelector('input[name=pr]:checked').value,remind:rem===''?'':+rem,note:document.getElementById('f-note').value.trim()};
    var it=editing?find(editing):null;
    if(it){for(var k in v)it[k]=v[k];delete it.ex;}
    else{v.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);v.done=false;state.items.push(v);}
    closeSheet();save();
  });
}

function start(d){
  if(d&&d.tab)tab=d.tab;
  shell();render();
  setInterval(function(){if(!document.getElementById('ov').classList.contains('open'))render();},30000);
  var c=window.claude;
  if(c&&c.use)c.use('artifact').then(function(a){store=a;storeChecked=true;render();}).catch(function(){storeChecked=true;render();});
  else{storeChecked=true;render();}
  try{if(c&&c.hot&&c.hot.snapshot)c.hot.snapshot(function(){return{tab:tab};});}catch(e){}
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script></body></html>
