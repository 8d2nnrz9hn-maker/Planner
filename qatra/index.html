<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قطرة · Qatra</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قطرة"><meta name="theme-color" content="#F5F8FC">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif;background:#F5F8FC;color:#14324B;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:100%;max-width:380px;text-align:center}
.logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#4FA9E0,#2F6FDB);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 30px rgba(47,111,219,.25)}
h1{font-size:30px;font-weight:700}h1 span{font-family:Inter;font-weight:600;color:#6B7F92;font-size:20px;margin-inline-start:8px}
p{color:#6B7F92;margin:8px 0 28px;line-height:1.6}
button{display:block;width:100%;padding:16px;border-radius:16px;border:1px solid #DCE5EE;background:#fff;font:600 18px inherit;color:#14324B;margin-bottom:12px;cursor:pointer}
button.en{font-family:Inter}
button:active{background:#E9F0FB;border-color:#2F6FDB}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z" fill="#fff"/></svg></div>
  <h1>قطرة<span>Qatra</span></h1>
  <p>اختر لغة البرنامج<br><span style="font-family:Inter">Choose the app language</span></p>
  <button onclick="pick('ar')">العربية</button>
  <button class="en" onclick="pick('en')">English</button>
</div>
<script>
function pick(l){try{localStorage.setItem('qatra_lang',JSON.stringify(l));}catch(e){}location.replace(l==='ar'?'ar.html':'en.html');}
try{const l=JSON.parse(localStorage.getItem('qatra_lang')||'null');if((l==='ar'||l==='en')&&!location.hash.includes('pick'))location.replace(l==='ar'?'ar.html':'en.html');}catch(e){}
</script>
</body>
</html>
